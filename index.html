
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="height=device-height, initial-scale=1.0">

    <title>I'm So Sorry ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #16000a, #3d0015, #100008);
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        /* Heart */
        .heart {
            width: 100px;
            height: 100px;
            background: #ff1744;
            position: relative;
            transform: rotate(-45deg);
            margin: 40px auto;
            animation: heartbeat 1.2s infinite;
            box-shadow: 0 0 40px #ff1744;
        }

        .heart::before,
        .heart::after {
            content: "";
            width: 100px;
            height: 100px;
            background: #ff1744;
            border-radius: 50%;
            position: absolute;
        }

        .heart::before {
            top: -50px;
            left: 0;
        }

        .heart::after {
            left: 50px;
            top: 0;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: rotate(-45deg) scale(1);
            }

            50% {
                transform: rotate(-45deg) scale(1.2);
            }
        }

        h1 {
            font-size: 55px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px #ff1744;
        }

        .message {
            font-size: 25px;
            min-height: 40px;
            color: #ffd6df;
        }

        button {
            margin-top: 35px;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: #ff1744;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff1744;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 35px #ff1744;
        }

        /* Floating hearts */
        .floating-heart {
            position: absolute;
            bottom: -50px;
            color: #ff4770;
            font-size: 25px;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 38px;
            }

            .message {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>I'm So Sorry 🥺</h1>

        <div class="heart"></div>

        <p class="message" id="message"></p>

        <button onclick="pardonMe()">
            Please Pardon Me ❤️
        </button>

    </div>
 <audio id="song" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<button onclick="toggleMusic()" id="musicBtn">
    🎵 Play Music
</button>


    <script>
const song = document.getElementById("song");
const musicBtn = document.getElementById("musicBtn");

function toggleMusic() {
    if (song.paused) {
        song.play();
        musicBtn.innerHTML = "⏸️ Pause Music";
    } else {
        song.pause();
        musicBtn.innerHTML = "🎵 Play Music";
    }
}
        // Typing animation
        const text = "Please forgive me... I really am sorry ❤️";
        const message = document.getElementById("message");

        let index = 0;

        function typeText() {

            if (index < text.length) {

                message.innerHTML += text.charAt(index);

                index++;

                setTimeout(typeText, 70);
            }
        }

        typeText();


        // Create floating hearts
        function createHeart() {

            const heart = document.createElement("div");

            heart.classList.add("floating-heart");

            heart.innerHTML = "❤️";

            heart.style.left = Math.random() * 100 + "vw";

            heart.style.fontSize =
                (15 + Math.random() * 30) + "px";

            heart.style.animationDuration =
                (4 + Math.random() * 5) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 9000);
        }

        setInterval(createHeart, 500);


        // Button
        function pardonMe() {

            alert("Thank you for forgiving me ❤️🥺");

            document.querySelector("h1").innerHTML =
                "Thank You ❤️";

            document.querySelector(".message").innerHTML =
                "You mean a lot to me. I'll try my best not to hurt you again. 🥺❤️";
        }

    </script>

</body>
</html>
