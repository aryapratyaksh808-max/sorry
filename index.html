
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="height=device-height, initial-scale=1.0">

    <title>I'm So Sorry 😭</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;

            /* Friendly brother-sister theme */
            background: linear-gradient(
                135deg,
                #102a43,
                #1b4965,
                #243b53
            );

            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 25px;

            text-shadow: 0 0 20px #7dd3fc;
        }

        .message {
            font-size: 25px;
            min-height: 40px;
            color: #e0f2fe;
        }

        button {
            margin-top: 35px;
            padding: 15px 30px;

            border: none;
            border-radius: 30px;

            background: #0284c7;
            color: white;

            font-size: 18px;
            cursor: pointer;

            box-shadow: 0 0 20px #0284c7;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 35px #38bdf8;
        }

        /* Falling emojis */

        .floating-heart {
            position: absolute;
            bottom: -50px;

            font-size: 25px;

            animation: floatUp linear forwards;
        }

        @keyframes floatUp {

            from {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }

        }

        /* Music button */

        #musicBtn {
            position: absolute;
            bottom: 25px;
            right: 25px;

            margin: 0;

            background: #075985;
            box-shadow: 0 0 15px #0284c7;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 38px;
            }

            .message {
                font-size: 19px;
            }

        }

    </style>

</head>


<body>


    <div class="container">

        <h1 id="title">
            I'm So Sorry 😭
        </h1>

        <p class="message" id="message"></p>

        <button onclick="pardonMe()">
            Please Pardon Me 😭
        </button>

    </div>


    <!-- Music -->

    <audio id="song" loop>

        <source src="song.mp3" type="audio/mpeg">

    </audio>


    <button onclick="toggleMusic()" id="musicBtn">
        🎵 Play Music
    </button>



    <script>


        /* =========================
           MUSIC
        ========================= */

        const song = document.getElementById("song");

        const musicBtn =
            document.getElementById("musicBtn");


        function toggleMusic() {

            if (song.paused) {

                song.play();

                musicBtn.innerHTML =
                    "⏸️ Pause Music";

            }

            else {

                song.pause();

                musicBtn.innerHTML =
                    "🎵 Play Music";

            }

        }



        /* =========================
           TYPING ANIMATION
        ========================= */

        const text =
            "Please forgive me... I really am sorry 😭";

        const message =
            document.getElementById("message");

        let index = 0;


        function typeText() {

            if (index < text.length) {

                message.innerHTML +=
                    text.charAt(index);

                index++;

                setTimeout(typeText, 70);

            }

        }


        typeText();



        /* =========================
           FALLING EMOJIS
        ========================= */

        let emojis = [
            "😭",
            "🥲",
            "😢",
            "😔",
            "🙏"
        ];


        function createHeart() {

            const heart =
                document.createElement("div");

            heart.classList.add(
                "floating-heart"
            );


            heart.innerHTML =
                emojis[
                    Math.floor(
                        Math.random() * emojis.length
                    )
                ];


            heart.style.left =
                Math.random() * 100 + "vw";


            heart.style.fontSize =
                (15 + Math.random() * 30) + "px";


            heart.style.animationDuration =
                (4 + Math.random() * 5) + "s";


            document.body.appendChild(heart);


            setTimeout(() => {

                heart.remove();

            }, 9000);

        }


        setInterval(createHeart, 500);



        /* =========================
           PARDON BUTTON
        ========================= */

        function pardonMe() {

            alert(
                "Okay okay! No more crying 😂🤣"
            );


            document.getElementById("title")
                .innerHTML =
                "Thank You 😂🤣";


            document.querySelector(".message")
                .innerHTML =
                "You're the best sister ever! 😎😂 Now stop being angry!";


            /* Change falling emojis */

            emojis = [
                "😂",
                "🤣",
                "😎",
                "🤪",
                "🙌",
                "🎉"
            ];


            /* Change button */

            document.querySelector(
                ".container button"
            ).innerHTML =
                "Okay We're Good Now 😂";


        }

    </script>

</body>

</html>
